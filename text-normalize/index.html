<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全角半角・空白の統一（無料・ブラウザだけで動く）｜SmallApp Lab</title>
<meta name="description" content="Excelやスプレッドシートからコピーした表の、全角と半角、余分な空白をそろえます。データはブラウザの中だけで処理し、どこにも送りません。">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2a44;--sub:#5b6476;--line:#d5dbe3;--accent:#0f7c7a}
@media (prefers-color-scheme:dark){:root{--bg:#14181f;--card:#1d232c;--ink:#e6e9ee;--sub:#a3acba;--line:#333c48;--accent:#4fc1bd}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Meiryo",sans-serif;line-height:1.6}
main{max-width:1080px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.lead{color:var(--sub);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
label{font-weight:600;display:block;margin-bottom:4px}
.opt{font-weight:400;display:block;margin:2px 0}
textarea{width:100%;min-height:220px;font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:14px;cursor:pointer}
.pill{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px}
.note{font-size:13px;color:var(--sub)}
footer{margin-top:24px;font-size:13px;color:var(--sub)}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>全角半角・空白の統一</h1>
<p class="lead">表からコピーした文字の、全角と半角、余分な空白をそろえます。名前や品番の突き合わせの前に使えます。</p>

<div class="card">
<label class="opt"><input type="checkbox" id="ascii" checked> 全角の英数字と記号を半角にする（Ａ１ → A1）</label>
<label class="opt"><input type="checkbox" id="kana" checked> 半角カナを全角にする（ｶﾞｽ → ガス）</label>
<label class="opt"><input type="checkbox" id="space" checked> 全角の空白を半角にする</label>
<label class="opt"><input type="checkbox" id="multi" checked> 続いた空白を1つにする</label>
<label class="opt"><input type="checkbox" id="trim" checked> セルの前後の空白を消す</label>
<p class="note">タブと改行は残すので、Excelの表の形のまま貼り戻せます。データはこのブラウザの中だけで処理し、どこにも送りません。</p>
</div>

<div class="grid">
<div class="card">
<label for="in">元の文字（Excelからそのまま貼れます）</label>
<textarea id="in"></textarea>
<div class="row"><button id="run">そろえる</button></div>
</div>
<div class="card">
<label for="out">そろえた文字</label>
<textarea id="out" readonly></textarea>
<div class="row"><button id="copy">コピーする</button><span class="pill" id="count">変わったセル 0</span></div>
</div>
</div>

<footer>
<p>同じような表の処理を、あなたの列名に合わせて作ります。小さいものは3,000円から: <a href="https://coconala.com/services/4478748">ココナラで相談する</a> ／ <a href="mailto:sales@ustoolstudio.com">メールで相談する</a></p>
<p>SmallApp Lab の無料の道具: <a href="../csv-diff/">2つの表の不一致チェック</a> ／ <a href="../csv-fix/">CSVの文字化け直し</a></p>
</footer>
</main>
<script>
"use strict";
function fixCell(s, o) {
  if (o.ascii) s = s.replace(/[！-～]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
  if (o.kana) s = s.replace(/[｡-ﾟ]+/g, function (c) { return c.normalize("NFKC"); });
  if (o.space) s = s.replace(/　/g, " ");
  if (o.multi) s = s.replace(/ {2,}/g, " ");
  if (o.trim) s = s.replace(/^[ 　]+|[ 　]+$/g, "");
  return s;
}

function fixAll(text, o) {
  var changed = 0;
  var out = text.split("\n").map(function (line) {
    var cr = line.endsWith("\r");
    var body = cr ? line.slice(0, -1) : line;
    var cells = body.split("\t").map(function (c) {
      var f = fixCell(c, o);
      if (f !== c) changed++;
      return f;
    });
    return cells.join("\t") + (cr ? "\r" : "");
  }).join("\n");
  return { text: out, changed: changed };
}

function options() {
  var o = {};
  ["ascii", "kana", "space", "multi", "trim"].forEach(function (k) { o[k] = document.getElementById(k).checked; });
  return o;
}

document.getElementById("run").addEventListener("click", function () {
  var r = fixAll(document.getElementById("in").value, options());
  document.getElementById("out").value = r.text;
  document.getElementById("count").textContent = "変わったセル " + r.changed;
});
document.getElementById("copy").addEventListener("click", function () {
  navigator.clipboard.writeText(document.getElementById("out").value);
});
</script>
</body>
</html>
